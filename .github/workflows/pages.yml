name: Update calendar and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require a fresh sync output
        run: |
          rm -f public/data/events.json
          echo "SYNC_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Fetch current schedules
        id: sync
        continue-on-error: true
        run: npm run sync
      - name: Validate generated feed before publishing
        run: npm run verify:feed
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy calendar and source status
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Report incomplete sync
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::Calendar sync did not complete cleanly. Published only the freshly validated feed; inspect the sync logs and source status.'
          exit 1
