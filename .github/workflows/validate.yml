name: Validate calendar changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check official alternate endpoints live
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { fetchHolidayCalendar } from './scripts/holiday-source.ts';
          import { fetchText, sources } from './scripts/shared.ts';
          for (const url of [
            'https://s2.q4cdn.com/154085107/files/doc_news/NYSE-Group-Announces-2026-2027-and-2028-Holiday-and-Early-Closings-Calendar-2025.pdf',
            'https://www.sse.com.cn/disclosure/dealinstruc/closed/c/c_20251222_10802510.shtml',
            'https://nasdaqtrader.com/Trader.aspx?id=Calendar',
          ]) {
            try {
              const response = await fetch(url, { headers: { 'User-Agent': 'MarketCalendar/0.1' }, signal: AbortSignal.timeout(30000) });
              console.info(JSON.stringify({ probe: url, status: response.status, bytes: (await response.arrayBuffer()).byteLength }));
            } catch (error) { console.warn(JSON.stringify({ probe: url, error: String(error) })); }
          }
          for (const id of ['nyse', 'sse']) {
            const result = await fetchHolidayCalendar(id, new Date().getUTCFullYear(), async (url, accept) => {
              if (url === sources[id].url) throw new Error('Primary intentionally skipped for alternate smoke test');
              return fetchText(url, accept);
            });
            console.info(JSON.stringify({ source: id, url: result.source.url, events: result.events.length }));
          }
          JS
      - name: Check live data from the deployment runner
        run: |
          rm -f public/data/events.json
          export SYNC_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npm run sync
          npm run verify:feed
