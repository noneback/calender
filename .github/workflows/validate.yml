name: Validate calendar changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check live data from the deployment runner
        run: |
          rm -f public/data/events.json
          export SYNC_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npm run sync
          npm run verify:feed
